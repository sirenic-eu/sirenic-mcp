name: Snapshot drift

# Every day, the shipped snapshot (catalogue/instantane.json) is compared with the free, anonymous tools/list of the
# Sirenic server. On any difference a client would see, one issue (label instantane-derive) is opened, or the open one
# is updated, so that a new snapshot is proposed. A comparison that fails turns the run red and touches no issue.
# GitHub disables a scheduled workflow after 60 days without activity in the repository (README).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: derive-instantane
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Compare the snapshot with the server (free tools/list)
        id: compare
        run: |
          set +e
          npx tsx scripts/derive.ts --rapport derive.md
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            echo "::error::the comparison could not be made (exit code $code): no issue touched"
            exit 1
          fi
      - name: Open or update the drift issue
        if: steps.compare.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          label=instantane-derive
          gh label create "$label" --repo "$REPO" --color FBCA04 --description "The snapshot differs from the Sirenic server" 2>/dev/null || true
          number=$(gh issue list --repo "$REPO" --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --label "$label" --title "The snapshot differs from the Sirenic server: a new one is needed" --body-file derive.md
            exit 0
          fi
          before=$(gh issue view "$number" --repo "$REPO" --json body --jq '.body' | head -n 1)
          after=$(head -n 1 derive.md)
          gh issue edit "$number" --repo "$REPO" --body-file derive.md
          if [ "$before" != "$after" ]; then
            gh issue comment "$number" --repo "$REPO" --body "The differences changed: the description above is today's comparison."
          fi
